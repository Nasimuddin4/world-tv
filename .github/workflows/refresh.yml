name: Refresh channel list

on:
  schedule:
    - cron: "17 2 * * *"   # every day 02:17 UTC (08:17 Dhaka)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python build.py --fetch
      - name: Commit and push if changed
        run: |
          git config user.name "Nasim"
          git config user.email "81671112+Nasimuddin4@users.noreply.github.com"
          git add -A site embed_cache.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Daily channel refresh $(date -u +%F)"
          git push
